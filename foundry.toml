[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

# ── RPC endpoints (referenced by alias in forge script --rpc-url <alias>) ──

[rpc_endpoints]
base          = "${BASE_RPC_URL}"
base_sepolia  = "${BASE_SEPOLIA_RPC_URL}"
arbitrum_one  = "${ARBITRUM_ONE_RPC_URL}"
bsc           = "${BSC_RPC_URL}"
bsc_testnet   = "${BSC_TESTNET_RPC_URL}"
polygon       = "${POLYGON_RPC_URL}"
polygon_amoy  = "${POLYGON_AMOY_RPC_URL}"
celo          = "${CELO_RPC_URL}"
celo_alfajores = "${CELO_ALFAJORES_RPC_URL}"
plasma        = "${PLASMA_RPC_URL}"
tron_shasta   = "${TRON_SHASTA_RPC_URL}"
tron_nile     = "${TRON_NILE_RPC_URL}"
tron_mainnet  = "${TRON_MAINNET_RPC_URL}"

# ── Etherscan / block-explorer verification keys ──

[etherscan]
base          = { key = "${BASESCAN_API_KEY}",    url = "https://api.basescan.org/api",            chain = 8453 }
base_sepolia  = { key = "${BASESCAN_API_KEY}",    url = "https://api-sepolia.basescan.org/api",    chain = 84532 }
arbitrum_one  = { key = "${ARBISCAN_API_KEY}",    url = "https://api.arbiscan.io/api",              chain = 42161 }
bsc           = { key = "${BSCSCAN_API_KEY}",     url = "https://api.bscscan.com/api",             chain = 56 }
bsc_testnet   = { key = "${BSCSCAN_API_KEY}",     url = "https://api-testnet.bscscan.com/api",     chain = 97 }
polygon       = { key = "${POLYGONSCAN_API_KEY}", url = "https://api.polygonscan.com/api",          chain = 137 }
polygon_amoy  = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api",     chain = 80002 }
celo          = { key = "${CELOSCAN_API_KEY}",    url = "https://api.celoscan.io/api",              chain = 42220 }
celo_alfajores = { key = "${CELOSCAN_API_KEY}",   url = "https://api-sepolia.celoscan.io/api",      chain = 11142220 }
plasma        = { key = "${PLASMA_API_KEY}",      url = "https://api.routescan.io/v2/network/mainnet/evm/9745/etherscan/api", chain = 9745 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
